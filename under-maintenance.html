<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #f8fafc;
            padding: 20px;
        }

        /* Ambient Glow Background */
        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphic Card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #f59e0b;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(245, 158, 11, 0.15);
        }

        /* Animated Interactive Emoji Section */
        .emoji-wrapper {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            margin-bottom: 15px;
            position: relative;
        }

        .emoji-container {
            font-size: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .hammer {
            display: inline-block;
            animation: thokna 0.8s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate;
            transform-origin: bottom right;
        }

        .wrench {
            display: inline-block;
            animation: ghumna 2s linear infinite;
        }

        .spark {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            pointer-events: none;
        }

        .spark.active {
            animation: spark-pop 0.4s ease-out forwards;
        }

        /* Progress Bar Styling */
        .progress-box {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 4px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 10px;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        /* Typography */
        h1 {
            color: #fbbf24;
            font-size: 1.75rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .message {
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        /* Dynamic Philosophy Quote Box */
        .quote-box {
            background: rgba(15, 23, 42, 0.4);
            border-left: 3px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 25px;
            text-align: left;
            min-height: 70px;
            display: flex;
            align-items: center;
        }

        .quote-text {
            font-style: italic;
            font-size: 0.9rem;
            color: #94a3b8;
            transition: opacity 0.3s ease;
        }

        /* Interactive Action Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
            transform: scale(1.05);
        }

        /* Keyframes */
        @keyframes thokna {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-40deg); }
        }

        @keyframes ghumna {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spark-pop {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
        }

        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 1.4rem; }
            .emoji-container { font-size: 60px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card">
        <!-- Interactive Emoji with Tap Feedback -->
        <div class="emoji-wrapper" id="emojiTrigger" title="Click to strike!">
            <div class="emoji-container">
                <span class="hammer" id="hammer">🔨</span>
                <span class="wrench">🔧</span>
            </div>
            <span class="spark" id="spark">💥</span>
        </div>

        <h1>Under Construction, Crafting Magic!</h1>
        
        <p class="message">
            Heavy engineering in progress under the hood. Logic and aesthetics are being tuned for perfection!
        </p>

        <!-- Dynamic Simulated Progress Bar -->
        <div class="progress-box">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text">
                <span>Building perfection...</span>
                <span id="progressPercent">42%</span>
            </div>
        </div>

        <!-- Philosophical Quotes Container -->
        <div class="quote-box">
            <p class="quote-text" id="quoteText">"Patience produces not just sweet results, but bug-free code."</p>
        </div>

        <!-- Interactive Control Buttons -->
        <div class="btn-group">
            <button class="btn" onclick="nextQuote()">
                <span>💡</span> New Thought
            </button>
            <button class="btn" onclick="boostProgress()">
                <span>🚀</span> Boost Speed
            </button>
        </div>
    </div>

    <script>
        // Philosophical & Creative Quotes Array
        const quotes = [
            "\"Patience produces not just sweet results, but bug-free code.\"",
            "\"Great monuments take time, and so do scalable systems.\"",
            "\"First make the logic right; aesthetics will naturally follow.\"",
            "\"Being under construction is not a failure, it is a sign of evolution.\"",
            "\"Stay calm—every single pixel is being crafted with precision.\""
        ];

        let currentQuoteIndex = 0;
        let progress = 42;

        // Interactive Hammer Strike Effect
        const trigger = document.getElementById('emojiTrigger');
        const spark = document.getElementById('spark');
        const hammer = document.getElementById('hammer');

        trigger.addEventListener('click', () => {
            // Manual Animation trigger
            hammer.style.animation = 'none';
            setTimeout(() => hammer.style.animation = '', 10);

            // Spark burst animation
            spark.style.setProperty('--tx', `${(Math.random() - 0.5) * 60}px`);
            spark.style.setProperty('--ty', `${-20 - Math.random() * 30}px`);
            spark.classList.remove('active');
            setTimeout(() => spark.classList.add('active'), 10);

            // Subtle haptic-like card bounce
            const card = document.querySelector('.card');
            card.style.transform = 'scale(0.98)';
            setTimeout(() => card.style.transform = '', 100);

            // Audio Click Feedback
            playClickSound();
        });

        // Synthesized Audio Feedback via Web Audio API
        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                // Audio Context fallback
            }
        }

        // Philosophy Quote Switcher
        function nextQuote() {
            const quoteEl = document.getElementById('quoteText');
            quoteEl.style.opacity = 0;
            
            setTimeout(() => {
                currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
                quoteEl.innerText = quotes[currentQuoteIndex];
                quoteEl.style.opacity = 1;
            }, 300);
        }

        // Interactive Progress Booster
        function boostProgress() {
            if (progress < 98) {
                progress += Math.floor(Math.random() * 8) + 3;
                if (progress > 98) progress = 98;
                updateProgressUI();
            }
        }

        function updateProgressUI() {
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressPercent').innerText = progress + '%';
        }

        // Initial Progress Set
        updateProgressUI();
    </script>
</body>
</html>
